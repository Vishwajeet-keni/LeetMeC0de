<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LeetMeC0de Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <h1>LeetMeC0de Settings</h1>
    <section>
      <h2>GitHub Access</h2>
      <label>Token</label>
      <input type="password" id="token" placeholder="github_pat_..." />
      <label>Owner</label>
      <input type="text" id="owner" placeholder="your-username" />
      <label>Repo</label>
      <input type="text" id="repo" placeholder="leetcode-solutions" />
      <label>Branch</label>
      <input type="text" id="branch" placeholder="main" />
      <button id="testBtn">Test Connection</button>
      <span id="testResult"></span>
    </section>
    <section>
      <h2>Preferences</h2>
      <label>Folder structure</label>
      <select id="folderStructure">
        <option value="by-difficulty">By difficulty</option>
        <option value="flat">Flat</option>
      </select>
      <label><input type="checkbox" id="includeReadme" /> Include README</label>
    </section>
    <button id="saveBtn">Save</button>
    <div id="saveStatus"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
