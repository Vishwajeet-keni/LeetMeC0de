<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LeetMeC0de Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>LeetMeC0de</h1>
      <p class="subtitle">Settings</p>
    </div>

    <section class="card">
      <div class="card-header">
        <h2>GitHub Access</h2>
        <span id="connectionDot" class="dot dot-idle"></span>
      </div>

      <label for="token">Personal Access Token</label>
      <input type="password" id="token" placeholder="github_pat_..." />

      <div class="row-2">
        <div>
          <label for="owner">Owner</label>
          <input type="text" id="owner" placeholder="your-username" />
        </div>
        <div>
          <label for="repo">Repo</label>
          <input type="text" id="repo" placeholder="leetcode-solutions" />
        </div>
      </div>

      <label for="branch">Branch</label>
      <input type="text" id="branch" placeholder="main" />

      <div class="test-row">
        <button id="testBtn" class="btn-secondary">Test Connection</button>
        <span id="testResult" class="test-result"></span>
      </div>
    </section>

    <section class="card">
      <h2>Preferences</h2>

      <label for="folderStructure">Folder structure</label>
      <select id="folderStructure">
        <option value="by-difficulty">By difficulty (Easy / Medium / Hard)</option>
        <option value="flat">Flat (one folder per problem)</option>
      </select>

      <label class="checkbox-row">
        <input type="checkbox" id="includeReadme" />
        <span>Include problem statement as README.md</span>
      </label>
    </section>

    <button id="saveBtn" class="btn-primary">Save Settings</button>
    <div id="saveStatus" class="save-status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
